[project]
name = "aurora"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["google-adk==2.12.0", "fastapi", "uvicorn", "python-dotenv"]

[project.scripts]
api = "aurora.servidor:main"
restaurar = "aurora.restaurar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    'ignore:\[EXPERIMENTAL\] feature FeatureName.TOOL_CONFIRMATION:UserWarning',
]
